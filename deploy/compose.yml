name: semconnect

services:
  nats:
    image: nats:2.14.4-alpine@sha256:f2123f533c2b0cada0a5c5ec434fb2b8cfe1cf220215ef9d7517e1372917ad66
    command: ["-c", "/etc/nats/nats.conf"]
    restart: unless-stopped
    volumes:
      - semconnect-nats-setup03a-8b99efe9c66a-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [backend]

  # Explicit first-start adoption of the public c360.semconnect authority.
  # Create-only; a differing stored identity is an error, never overwritten.
  provision-identity:
    image: semconnect-graph-backend:setup03a-8b99efe9c66a
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: production
    command: ["-config", "/etc/semstreams/config.json", "-provision-identity", "semconnect"]
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./semstreams.json:/etc/semstreams/config.json:ro
    networks: [backend]

  semstreams:
    image: semconnect-graph-backend:setup03a-8b99efe9c66a
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: production
    command: ["-config", "/etc/semstreams/config.json", "-cs-api-config", "/etc/semconnect/config.json"]
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
      provision-identity:
        condition: service_completed_successfully
    volumes:
      - ./semstreams.json:/etc/semstreams/config.json:ro
      - ./semconnect.json:/etc/semconnect/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks: [backend]

  semconnect:
    image: semconnect-cs-api:setup03a-8b99efe9c66a
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["-config", "/etc/semconnect/config.json"]
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
      semstreams:
        condition: service_healthy
    volumes:
      - ./semconnect.json:/etc/semconnect/config.json:ro
    ports:
      - "${SEMCONNECT_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/cs-api-server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [backend, public]

  canonical-smoke:
    profiles: ["smoke"]
    image: semconnect-canonical-smoke:setup03a-8b99efe9c66a
    build:
      context: ..
      dockerfile: deploy/probe/Dockerfile
    depends_on:
      semconnect:
        condition: service_healthy
    environment:
      SEMCONNECT_URL: http://semconnect:8080
    command: ["verify-only"]
    networks: [backend, public]

  greenfield-preflight:
    profiles: ["smoke"]
    image: semconnect-canonical-smoke:setup03a-8b99efe9c66a
    build:
      context: ..
      dockerfile: deploy/probe/Dockerfile
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_MONITOR_URL: http://nats:8222
    command: ["preflight"]
    networks: [backend]

volumes:
  semconnect-nats-setup03a-8b99efe9c66a-data:
    name: ${SEMCONNECT_NATS_VOLUME:-semconnect-nats-setup03a-8b99efe9c66a-data}

networks:
  backend:
    internal: true
  public:
